{% extends "base.html" %}

{% block title %}{% if book %}Edit Book{% else %}Add Book{% endif %} - City Library{% endblock %}

{% block content %}
<div class="form-card">
    <h2>{% if book %}Edit Book{% else %}Add New Book{% endif %}</h2>

    <form action="{% if book %}/books/edit/{{ book.id }}{% else %}/books/add{% endif %}" method="post">
        <div class="form-group">
            <label for="title">Book Title</label>
            <input type="text" id="title" name="title" value="{{ book.title if book else '' }}" required>
        </div>
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" value="{{ book.author if book else '' }}" required>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" value="{{ book.category if book else '' }}" required>
        </div>
        <div class="form-group">
            <label for="total_copies">Total Copies</label>
            <input type="number" id="total_copies" name="total_copies" min="1" value="{{ book.total_copies if book else 1 }}" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
            {% if book %}Save Changes{% else %}Add Book{% endif %}
        </button>
    </form>
    <p class="form-footer"><a href="/">Back to Catalog</a></p>
</div>
{% endblock %}
