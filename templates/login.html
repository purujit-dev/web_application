{% extends "base.html" %}

{% block title %}Login - City Library{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Login</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post" onsubmit="return validateLoginForm();">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <p class="form-footer">Don't have an account? <a href="/register">Register here</a></p>

    <div class="demo-box">
        <p><strong>Demo Accounts:</strong></p>
        <p>Admin: <code>admin@library.com</code> / <code>admin123</code></p>
        <p>Student: <code>rahul@student.com</code> / <code>student123</code></p>
    </div>
</div>
{% endblock %}
